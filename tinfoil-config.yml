{
  "cvm-version": "0.14.13",
  "cpus": 2,
  "memory": 4096,
  "networks": {
    "verification": {
      "egress": "allowlist",
      "allow": [
        "95-133-254-84.nodes.verda.host",
        "api.axiom.stream",
        "api.github.com",
        "api.trustedservices.intel.com",
        "certificates.trustedservices.intel.com",
        "fulcio.sigstore.dev",
        "github-proxy.tinfoil.sh",
        "github.com",
        "inference.tinfoil.sh",
        "kds-proxy.tinfoil.sh",
        "kdsintf.amd.com",
        "nras.attestation.nvidia.com",
        "objects.githubusercontent.com",
        "raw.githubusercontent.com",
        "rekor.sigstore.dev",
        "release-assets.githubusercontent.com",
        "tuf-repo-cdn.sigstore.dev"
      ]
    }
  },
  "attested-keys": [
    {
      "id": "axiom-encryption",
      "key": "x25519",
      "uid": 10001,
      "gid": 10001
    },
    {
      "id": "axiom-authorization",
      "key": "ed25519",
      "uid": 10001,
      "gid": 10001
    }
  ],
  "containers": [
    {
      "name": "gateway",
      "image": "ghcr.io/astrea-foundation/axiom-web-gateway@sha256:4192b696163e6fdec45b3234d51d3020618f0a6f8ad6ddf9b45467ce0c4b4ef0",
      "user": "10001:10001",
      "attestation": true,
      "keys": [
        "axiom-encryption",
        "axiom-authorization"
      ],
      "read_only": true,
      "networks": [
        "verification"
      ],
      "restart": "on-failure",
      "healthcheck": {
        "test": [
          "CMD",
          "/usr/local/bin/axiom-gateway-health"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 3,
        "start_period": "120s"
      },
      "memory": "3072m",
      "pids_limit": 128,
      "env": [
        {
          "AXIOM_GATEWAY_CONFIG_JSON": "{\"listen\":\"0.0.0.0:8080\",\"public_origin\":\"https://axiom-gateway.axiomai.containers.tinfoil.dev\",\"backend_origin\":\"https://api.axiom.stream\",\"publisher_key\":\"c14866d87b4feb6ba248a6ffe314c6cf835117c995332c350930105990de83d7\",\"browser_origins\":[\"https://chat.axiom.stream\",\"https://auth.axiom.stream\"],\"max_concurrency\":32,\"max_sessions\":512,\"attestation_socket\":\"/tinfoil/attestation.sock\",\"encryption_key_path\":\"/run/tinfoil/keys/axiom-encryption/private_key.pem\",\"authorization_key_path\":\"/run/tinfoil/keys/axiom-authorization/private_key.pem\",\"verifier\":\"/usr/local/bin/axiom-gateway-verify\"}"
        },
        {
          "AXIOM_DIRECT_CLIENT_CONFIG_FILE": "/etc/axiom/astreaai-production.json"
        }
      ]
    }
  ],
  "shim": {
    "upstream-port": 8080,
    "upstream-container": "gateway",
    "origins": [
      "https://chat.axiom.stream",
      "https://auth.axiom.stream"
    ],
    "paths": [
      "/healthz",
      "/v1/attestation",
      "/v1/session",
      "/v1/rpc"
    ]
  }
}
