{
  "cvm-version": "0.14.13",
  "cpus": 2,
  "memory": 4096,
  "networks": {
    "verification": {
      "egress": "allowlist",
      "allow": [
        "api-staging.axiom.stream",
        "api.github.com",
        "api.trustedservices.intel.com",
        "fulcio.sigstore.dev",
        "github-proxy.tinfoil.sh",
        "github.com",
        "inference.tinfoil.sh",
        "kds-proxy.tinfoil.sh",
        "kdsintf.amd.com",
        "objects.githubusercontent.com",
        "raw.githubusercontent.com",
        "rekor.sigstore.dev",
        "release-assets.githubusercontent.com",
        "tuf-repo-cdn.sigstore.dev"
      ]
    }
  },
  "attested-keys": [
    {
      "id": "axiom-encryption",
      "key": "x25519",
      "uid": 10001,
      "gid": 10001
    },
    {
      "id": "axiom-authorization",
      "key": "ed25519",
      "uid": 10001,
      "gid": 10001
    }
  ],
  "containers": [
    {
      "name": "gateway",
      "image": "ghcr.io/astrea-foundation/axiom-web-gateway@sha256:6171c55a83819a62b2505e0c2e57435c8bcf20b5e2de97569d86ae897c639067",
      "user": "10001:10001",
      "attestation": true,
      "keys": [
        "axiom-encryption",
        "axiom-authorization"
      ],
      "read_only": true,
      "networks": [
        "verification"
      ],
      "restart": "on-failure",
      "memory": "3072m",
      "pids_limit": 128,
      "env": [
        {
          "AXIOM_GATEWAY_CONFIG_JSON": "{\"listen\":\"0.0.0.0:8080\",\"public_origin\":\"https://axiom-gateway-staging.axiomai.containers.tinfoil.dev\",\"backend_origin\":\"https://api-staging.axiom.stream\",\"publisher_key\":\"7ce33c4faec560b2fc191c7beb373a690ef80ba769e9011941f2578dc49b8c33\",\"browser_origins\":[\"https://app-staging.axiom.stream\",\"https://auth-staging.axiom.stream\"],\"max_concurrency\":32,\"max_sessions\":512,\"attestation_socket\":\"/tinfoil/attestation.sock\",\"encryption_key_path\":\"/run/tinfoil/keys/axiom-encryption/private_key.pem\",\"authorization_key_path\":\"/run/tinfoil/keys/axiom-authorization/private_key.pem\",\"verifier\":\"/usr/local/bin/axiom-gateway-verify\"}"
        }
      ]
    }
  ],
  "shim": {
    "upstream-port": 8080,
    "upstream-container": "gateway",
    "origins": [
      "https://app-staging.axiom.stream",
      "https://auth-staging.axiom.stream"
    ],
    "paths": [
      "/healthz",
      "/v1/attestation",
      "/v1/session",
      "/v1/rpc"
    ]
  }
}
