# DO NOT RUN MANUALLY. This workflow is dispatched automatically by
# `tinfoil-release.yml` against the newly created release tag.

name: Tinfoil Release - Publish (auto-triggered)

run-name: Publish release ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: tinfoil-container-release-${{ github.ref_name }}

jobs:
  measure-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      packages: write       # attach the attestation to the image
      id-token: write       # keyless attestation signing
      attestations: write   # publish the attestation

    steps:
      - name: Measure image, attest, and publish the release
        uses: tinfoilsh/measure-image-action@f2ec2fdf4510459730f0a5158c5817f5361e9461 # v0.13.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep staging release eligible for freshness witnesses
        if: contains(github.ref_name, '-staging.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        # The control plane witnesses active repositories' GitHub latest.
        # A staging suffix and staging-only runtime configuration still isolate
        # this gateway release from production and all Desktop release APIs.
        run: gh release edit "$RELEASE_REF" --prerelease=false --latest=false
