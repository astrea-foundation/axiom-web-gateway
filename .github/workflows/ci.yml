name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-go@v5
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - run: cd verifier && go test ./... && go vet ./...
      - run: go run github.com/tinfoilsh/tinfoil-config/cmd/tinfoil-config@70d5811ce0f931e4c9a0605a0c479eba94001c74 deploy/tinfoil/tinfoil-config.example.yml
      - run: pnpm build && pnpm typecheck && pnpm test
      - run: cargo test -p axiom-web-gateway --locked -- --ignored
      - run: python3 -m unittest discover -s scripts/tests && python3 -m py_compile scripts/prepare-tinfoil.py scripts/publish-documents.py scripts/record-build.py
